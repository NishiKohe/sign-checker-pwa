<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6d28d9">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sign Checker">
  <title>Sign Checker</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=11">
</head>
<body>
  <header class="topbar">
    <div><div class="eyebrow">AUTOGRAPH RADAR · UI v0.11</div><h1>Sign Checker</h1></div>
    <div class="top-actions"><button id="installBtn" class="secondary hidden">インストール</button><button id="syncBtn">同期</button></div>
  </header>

  <main class="content">
    <section class="hero card">
      <div><h2>獲得価値を優先</h2><p>サイン会 / 原画・一点物 / サイン本 / 個展・POP UP。終了済みは自動非表示。</p></div>
      <div class="pills"><span>先着優先</span><span>購入不要抽選優先</span><span>終了済み非表示</span></div>
    </section>

    <section class="stats">
      <article class="card"><small>未読</small><strong id="statUnseen">0</strong></article>
      <article class="card"><small>緊急 85+</small><strong id="statUrgent">0</strong></article>
      <article class="card"><small>表示中</small><strong id="statTotal">0</strong></article>
    </section>

    <section class="filters card">
      <input id="q" placeholder="作家名・作品名・会場">
      <select id="scoreFilter">
        <option value="0">全優先度</option>
        <option value="50">50+</option>
        <option value="85">85+ 緊急</option>
        <option value="100">100+ 最優先</option>
      </select>
      <select id="sortMode" aria-label="並び順">
        <option value="score">優先度順</option>
        <option value="event_start">開催日順</option>
        <option value="apply_start">申込開始順</option>
        <option value="apply_end">申込締切順</option>
      </select>
      <div class="chips" id="tabs">
        <button class="chip active" data-tab="all">新着</button>
        <button class="chip" data-tab="urgent">緊急</button>
        <button class="chip" data-tab="autograph_event">サイン会</button>
        <button class="chip" data-tab="original_art">原画・一点物</button>
        <button class="chip" data-tab="signed_book">サイン本</button>
        <button class="chip" data-tab="exhibition">個展・POP UP</button>
        <button class="chip" data-tab="campaign">応募企画</button>
        <button class="chip" data-tab="favorites">★</button>
      </div>
    </section>

    <section id="list" class="list" aria-live="polite"></section>

    <section class="settings card">
      <details><summary>設定 / バックエンド接続</summary><div class="settings-grid">
        <label>APIベースURL<input id="apiBase" placeholder="https://example.com"></label>
        <label>ウォッチリスト<input id="watchlist" placeholder="Na-Ga, 村田蓮爾, あるぷ"></label>
        <label class="check"><input id="demoMode" type="checkbox"> デモモード</label>
        <label class="check"><input id="showExpired" type="checkbox"> 終了済みも表示（確認・デバッグ用）</label>
        <div class="actions"><button id="saveSettingsBtn">設定保存</button><button id="seedBtn" class="secondary">デモ初期化</button></div>
      </div></details>
    </section>
  </main>

  <nav class="bottom-nav">
    <button data-tab="all" class="nav active">新着</button><button data-tab="urgent" class="nav">緊急</button><button data-tab="autograph_event" class="nav">会</button><button data-tab="original_art" class="nav">原画</button><button data-tab="signed_book" class="nav">本</button>
  </nav>

  <template id="itemTpl"><article class="item card"><div class="item-head"><div><h3></h3><p class="meta"></p></div><div class="score"></div></div><div class="badges"></div><p class="reason"></p><div class="actions item-actions"></div></article></template>
  <script src="./app.js?v=11" defer></script>
</body>
</html>
