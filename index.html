<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sign Checker">
  <title>Sign Checker</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=20">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="eyebrow">OPPORTUNITY RADAR · UI v0.20</div>
      <h1>Sign Checker</h1>
    </div>
    <div class="top-actions">
      <button id="installBtn" class="ghost hidden">インストール</button>
      <button id="syncBtn">更新</button>
    </div>
  </header>

  <main class="content">
    <section class="radar-head card">
      <div>
        <span class="section-kicker">いま見るべきもの</span>
        <h2>応募・購入・イベントを、行動順に。</h2>
        <p>情報元ではなく「次に何をするか」で整理。Sランクの新着・重要更新はメール通知対象です。</p>
      </div>
      <div class="sync-meta">
        <small>最終収集</small>
        <strong id="feedTime">--</strong>
        <span id="feedPolicy">収集状況を確認中</span>
      </div>
    </section>

    <section class="stats" aria-label="サマリー">
      <button class="stat card" data-lane="new"><small>NEW</small><strong id="statNew">0</strong><span>新着48h</span></button>
      <button class="stat card critical-stat" data-lane="critical"><small>S TIER</small><strong id="statCritical">0</strong><span>超高価値</span></button>
      <button class="stat card" data-lane="action"><small>DUE</small><strong id="statDue">0</strong><span>72h以内</span></button>
      <button class="stat card" data-lane="completed"><small>DONE</small><strong id="statCompleted">0</strong><span>応募・購入完了</span></button>
    </section>

    <section class="lane-switch card" aria-label="ビュー切替">
      <button class="lane active" data-lane="action"><span>今日やる</span><small>応募・購入</small></button>
      <button class="lane" data-lane="new"><span>新着</span><small>初回検出</small></button>
      <button class="lane" data-lane="critical"><span>高価値</span><small>S / A優先</small></button>
      <button class="lane" data-lane="watching"><span>追う</span><small>★保存</small></button>
      <button class="lane" data-lane="completed"><span>完了</span><small>学習データ</small></button>
    </section>

    <section class="toolbar card">
      <div class="search-row">
        <input id="q" class="search" placeholder="作家・作品・イベント・販売元を検索">
        <span id="resultCount" class="result-count">0件</span>
      </div>
      <div class="quick-types">
        <button class="type-chip active" data-type="all">全部</button>
        <button class="type-chip" data-type="lottery">抽選</button>
        <button class="type-chip" data-type="sale">販売</button>
        <button class="type-chip" data-type="event">イベント</button>
        <button class="type-chip" data-type="campaign">応募企画</button>
      </div>
      <details class="advanced">
        <summary>詳細フィルター</summary>
        <div class="filter-grid">
          <select id="sourceFilter"><option value="all">すべての情報元</option></select>
          <select id="tierFilter">
            <option value="all">すべての価値</option>
            <option value="S">S 超高価値</option>
            <option value="A">A 高価値</option>
            <option value="B">B</option>
            <option value="C">C</option>
          </select>
          <select id="acquisitionFilter">
            <option value="all">すべての獲得方式</option>
            <option value="first_come">先着</option>
            <option value="direct_sale">直接販売</option>
            <option value="lottery_free">購入不要抽選</option>
            <option value="lottery_open">抽選</option>
            <option value="lottery_purchase">購入条件付き抽選</option>
            <option value="unknown">方式未判定</option>
          </select>
          <select id="sortMode">
            <option value="smart">おすすめ順</option>
            <option value="deadline">締切が近い順</option>
            <option value="newest">新着順</option>
            <option value="value">価値順</option>
          </select>
        </div>
        <div id="activeTag" class="active-tag hidden"></div>
      </details>
    </section>

    <section class="section-head">
      <div><span class="section-kicker" id="laneKicker">ACTION</span><h2 id="laneTitle">今日やる</h2></div>
      <p id="laneHelp">受付中・販売中・締切間近を優先して表示します。</p>
    </section>

    <section id="list" class="list" aria-live="polite"></section>

    <section class="health card">
      <details>
        <summary>情報元の取得状況 <span id="healthSummary"></span></summary>
        <div id="sourceHealth" class="source-health"></div>
      </details>
    </section>

    <section class="settings card">
      <details><summary>設定</summary><div class="settings-grid">
        <label>ウォッチリスト<input id="watchlist" placeholder="Na-Ga, 村田蓮爾, あるぷ"></label>
        <label class="check"><input id="showExpired" type="checkbox"> 終了済みも表示（確認用）</label>
        <label class="check"><input id="demoMode" type="checkbox"> デモモード</label>
        <label class="hidden">APIベースURL<input id="apiBase"></label>
        <div class="actions"><button id="saveSettingsBtn">設定保存</button><button id="seedBtn" class="ghost">デモ初期化</button></div>
      </div></details>
    </section>
  </main>

  <nav class="bottom-nav">
    <button data-lane="action" class="nav active"><b>●</b><span>今日</span></button>
    <button data-lane="new" class="nav"><b>＋</b><span>新着</span></button>
    <button data-lane="critical" class="nav"><b>◆</b><span>高価値</span></button>
    <button data-lane="watching" class="nav"><b>★</b><span>追う</span></button>
    <button data-lane="completed" class="nav"><b>✓</b><span>完了</span></button>
  </nav>

  <template id="itemTpl">
    <article class="opportunity card">
      <div class="opportunity-top">
        <div class="badges"><span class="tier-badge"></span><span class="action-badge"></span><span class="new-badge hidden">NEW</span></div>
        <div class="score-mini"><small>VALUE</small><strong class="value-score"></strong></div>
      </div>
      <h3></h3>
      <div class="card-meta"><span class="source"></span><span class="creator"></span><span class="location"></span></div>
      <div class="deadline-panel">
        <div><small>次の締切</small><strong class="deadline-main">未取得</strong></div>
        <span class="countdown"></span>
      </div>
      <div class="event-date"><small>開催</small><strong>未取得</strong></div>
      <div class="item-tags"></div>
      <div class="why-line"></div>
      <details class="reason-details"><summary>判定・学習の根拠</summary><p class="reason"></p></details>
      <div class="primary-actions"></div>
      <div class="manage-actions"></div>
    </article>
  </template>

  <script>try{if(!localStorage.getItem('sign-checker-pwa-v6')){const old=localStorage.getItem('sign-checker-pwa-v5')||localStorage.getItem('sign-checker-pwa-v4');if(old)localStorage.setItem('sign-checker-pwa-v6',old)}}catch{}</script>
  <script src="./app.js?v=20" defer></script>
</body>
</html>
