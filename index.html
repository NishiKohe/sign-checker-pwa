<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6d28d9">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sign Checker">
  <title>Sign Checker</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=12">
</head>
<body>
  <header class="topbar">
    <div><div class="eyebrow">AUTOGRAPH RADAR · UI v0.12</div><h1>Sign Checker</h1></div>
    <div class="top-actions"><button id="installBtn" class="secondary hidden">インストール</button><button id="syncBtn">同期</button></div>
  </header>

  <main class="content">
    <section class="hero card">
      <div><h2>サイン・色紙まとめ</h2><p>サイン会、サイン本、原画・直筆色紙、一点物、個展情報を情報元横断で整理。</p></div>
      <div class="pills"><span>サイン本重点</span><span>先着優先</span><span>購入不要抽選優先</span><span>終了済み非表示</span></div>
    </section>

    <section class="stats">
      <article class="card"><small>未読</small><strong id="statUnseen">0</strong></article>
      <article class="card"><small>緊急 85+</small><strong id="statUrgent">0</strong></article>
      <article class="card"><small>表示可能</small><strong id="statTotal">0</strong></article>
    </section>

    <section class="filters card">
      <div class="filter-head"><strong>検索・絞り込み</strong><span id="resultCount">0件</span></div>
      <input id="q" class="wide" placeholder="作家名・作品名・情報元・タグ・会場で検索">
      <select id="sourceFilter"><option value="all">すべての情報元</option></select>
      <select id="acquisitionFilter">
        <option value="all">すべての獲得方式</option>
        <option value="first_come">先着</option>
        <option value="direct_sale">直接販売</option>
        <option value="lottery_free">購入不要抽選</option>
        <option value="lottery_open">抽選</option>
        <option value="lottery_purchase">購入条件付き抽選</option>
        <option value="unknown">方式未判定</option>
      </select>
      <select id="scoreFilter">
        <option value="0">全優先度</option>
        <option value="50">50+</option>
        <option value="85">85+ 緊急</option>
        <option value="100">100+ 最優先</option>
      </select>
      <select id="sortMode" aria-label="並び順">
        <option value="score">優先度順</option>
        <option value="event_start">開催日順</option>
        <option value="apply_start">申込開始順</option>
        <option value="apply_end">申込締切順</option>
      </select>

      <div class="filter-section wide">
        <small>情報元</small>
        <div class="source-chips" id="sourceChips"></div>
      </div>
      <div id="activeTag" class="active-tag wide hidden"></div>
      <div class="chips wide" id="tabs">
        <button class="chip active" data-tab="all">すべて</button>
        <button class="chip" data-tab="urgent">緊急</button>
        <button class="chip" data-tab="autograph_event">サイン会</button>
        <button class="chip" data-tab="signed_book">サイン本</button>
        <button class="chip" data-tab="original_art">原画・色紙</button>
        <button class="chip" data-tab="exhibition">個展・POP UP</button>
        <button class="chip" data-tab="campaign">応募企画</button>
        <button class="chip" data-tab="favorites">★</button>
      </div>
    </section>

    <section id="list" class="list" aria-live="polite"></section>

    <section class="settings card">
      <details><summary>設定 / バックエンド接続</summary><div class="settings-grid">
        <label>APIベースURL<input id="apiBase" placeholder="https://example.com"></label>
        <label>ウォッチリスト<input id="watchlist" placeholder="Na-Ga, 村田蓮爾, あるぷ"></label>
        <label class="check"><input id="demoMode" type="checkbox"> デモモード</label>
        <label class="check"><input id="showExpired" type="checkbox"> 終了済みも表示（確認・デバッグ用）</label>
        <div class="actions"><button id="saveSettingsBtn">設定保存</button><button id="seedBtn" class="secondary">デモ初期化</button></div>
      </div></details>
    </section>
  </main>

  <nav class="bottom-nav">
    <button data-tab="all" class="nav active">一覧</button><button data-tab="urgent" class="nav">緊急</button><button data-tab="autograph_event" class="nav">会</button><button data-tab="signed_book" class="nav">本</button><button data-tab="original_art" class="nav">色紙</button>
  </nav>

  <template id="itemTpl">
    <article class="item card">
      <div class="item-head">
        <div class="item-title-wrap"><h3></h3><div class="card-meta"><span class="creator"></span><span class="location"></span></div></div>
        <div class="score-box"><small>優先度</small><strong class="score-value"></strong></div>
      </div>
      <div class="item-tags"></div>
      <div class="timeline-grid">
        <div class="date-box" data-date="event_start"><small>開催</small><strong class="date-value">未取得</strong></div>
        <div class="date-box" data-date="apply_start"><small>申込開始</small><strong class="date-value">未取得</strong></div>
        <div class="date-box" data-date="apply_end"><small>申込締切</small><strong class="date-value">未取得</strong></div>
      </div>
      <details class="reason-details"><summary>優先度の根拠</summary><p class="reason"></p></details>
      <div class="actions item-actions"></div>
    </article>
  </template>
  <script src="./app.js?v=12" defer></script>
</body>
</html>
