name: Collect autograph events

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: ['main']
    paths:
      - 'collector.py'
      - 'collector_v2.py'
      - 'collector_v3.py'
      - 'collector_v4.py'
      - 'collector_v5.py'
      - 'collector_v6.py'
      - 'collector_v7.py'
      - 'collector_v8.py'
      - 'collector_v9.py'
      - 'collector_v10.py'
      - 'collector_v11.py'
      - 'collector_v12.py'
      - 'collector_v13.py'
      - 'collector_v14.py'
      - 'collector_v15.py'
      - 'collector_v16.py'
      - 'collector_v17.py'
      - 'collector_v18.py'
      - 'config/creator_priority.json'
      - 'config/performer_priority.json'
      - 'requirements.txt'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

concurrency:
  group: sign-checker-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python collector_v18.py

      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/items.json; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "sign-checker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json
          git commit -m "Update autograph event feed"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
