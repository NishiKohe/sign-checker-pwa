name: Collect autograph events

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: ['main']
    paths:
      - 'collector.py'
      - 'collector_v2.py'
      - 'collector_v3.py'
      - 'collector_v4.py'
      - 'requirements.txt'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python collector_v4.py

      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/items.json; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "sign-checker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json
          git commit -m "Update autograph event feed"
          git push
