name: Mandarake auction parser smoke test

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'collector_v21.py'
      - 'collector_v22.py'
      - 'tests/test_mandarake_daily.py'
      - '.github/workflows/mandarake-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Parser regression tests
        run: python -m unittest discover -s tests -p 'test_mandarake_daily.py' -v
      - name: Check live daily-auction category
        run: |
          python - <<'PY'
          from datetime import datetime
          from bs4 import BeautifulSoup
          import collector_v21 as a
          url = a.url_for(a.SEARCHES[0]); r = a.base.HTTP.get(url, timeout=25)
          print('response', r.status_code, 'bytes', len(r.content), 'url', r.url)
          r.raise_for_status()
          soup = BeautifulSoup(r.text, 'html.parser')
          first = next(x for x in soup.find_all('a', href=True) if 'index=790574' in x.get('href', ''))
          for level, node in enumerate([first, *list(first.parents)[:6]]):
              print('DOM',level,'tag',node.name,'class',node.get('class'),'text',a.compact(node.get_text(' ',strip=True))[:650])
              print('HTML',str(node)[:2400])
          items = a.parse_list(r.text, url, datetime.now(a.JST))
          print('matched daily autograph lots', len(items), 'samples', [(x['title'], x['url']) for x in items[:6]])
          nonsense = [x for x in items if x['title'].startswith('0 ') or x['title'].startswith('ギャラリー')]
          print('nonsense-title count', len(nonsense))
          if not items:
              raise SystemExit('Daily-auction parser returned zero items')
          PY
