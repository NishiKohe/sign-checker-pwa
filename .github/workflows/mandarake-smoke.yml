name: Mandarake auction parser smoke test

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'collector_v21.py'
      - 'collector_v22.py'
      - 'tests/test_mandarake_daily.py'
      - '.github/workflows/mandarake-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Parser regression tests
        run: python -m unittest discover -s tests -p 'test_mandarake_daily.py' -v
      - name: Check live daily-auction category
        run: |
          python - <<'PY'
          from datetime import datetime
          import collector_v22
          import collector_v21 as a
          url = a.url_for(a.SEARCHES[0]); r = a.base.HTTP.get(url, timeout=25)
          print('response', r.status_code, 'bytes', len(r.content), 'url', r.url)
          r.raise_for_status()
          items = a.parse_list(r.text, url, datetime.now(a.JST))
          print('matched daily autograph lots', len(items), 'samples', [(x['title'], x['url']) for x in items[:8]])
          nonsense = [x for x in items if x['title'].startswith('0 ') or x['title'].startswith('ギャラリー') or 'ギャラリー サイン本' in x['title']]
          print('nonsense-title count', len(nonsense))
          assert len(items) >= 10, 'Daily-auction parser returned unexpectedly few lots'
          assert not nonsense, 'Found breadcrumb/countdown in lot title'
          PY
